name: CocinaLab iOS Build & Test

on:
  push:
    paths:
      - "CocinaLab.swiftpm/**"
      - ".github/workflows/cocinalab-ios.yml"
  pull_request:
    paths:
      - "CocinaLab.swiftpm/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: CocinaLab.swiftpm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (App Playground package)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme CocinaLab \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
