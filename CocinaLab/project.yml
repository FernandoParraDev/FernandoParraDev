name: CocinaLab
options:
  bundleIdPrefix: dev.fernandoparra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  CocinaLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CocinaLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: dev.fernandoparra.CocinaLab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CocinaLab/Preview Content\""
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - CocinaLabTests
      gatherCoverageData: true
  CocinaLabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CocinaLabTests
    dependencies:
      - target: CocinaLab
    settings:
      base:
        SWIFT_VERSION: "5.9"
